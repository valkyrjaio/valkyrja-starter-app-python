[project]
name = "valkyrja-starter-app-python-ci-importlinter"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["import-linter>=2.15,<3"]

[tool.uv]
# Environment-only project: install the tool, never build this directory.
package = false

# import-linter enforces module boundaries. The root poe task sets PYTHONPATH=src
# so `app` is importable.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

# Sindri is a build tool and never a runtime dependency of the application.
[[tool.importlinter.contracts]]
name = "The application does not import sindri"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["sindri"]
